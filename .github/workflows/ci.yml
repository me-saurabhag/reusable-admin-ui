name: Package CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, xml
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Lint package PHP source and configuration
        run: find src config -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check package JavaScript syntax
        run: find resources/js resources/stubs -type f -name '*.js' -print0 | xargs -0 -n1 node --check
